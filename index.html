<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blind Player</title>
<style>
  :root{
    --bg:#14110f; --panel:#1f1a17; --ink:#f3ece2; --muted:#9a8f82;
    --accent:#e8b53a; --ok:#6fcf97; --err:#ff7a6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next","Trebuchet MS",system-ui,sans-serif}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
  main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
  h1{font-size:1.1rem;letter-spacing:.18em;text-transform:uppercase;margin:0;color:var(--accent);font-weight:700}
  .card{background:var(--panel);border-radius:18px;padding:18px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #3a322c;background:#17130f;color:var(--ink);font-size:1rem}
  button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;font-weight:700;background:var(--accent);color:#1a1307;width:100%}
  button.ghost{background:transparent;color:var(--ink);border:1px solid #3a322c}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  #viewfinder{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1;display:none}
  #viewfinder video{width:100%;height:100%;object-fit:cover}
  #viewfinder::after{content:"";position:absolute;inset:18%;border:3px solid var(--accent);border-radius:18px}
  #status{min-height:3.2em;text-align:center;font-size:1.05rem}
  #status.ok{color:var(--ok)} #status.err{color:var(--err)}
  .hint{font-size:.8rem;color:var(--muted);line-height:1.45}
  .disc{width:120px;height:120px;border-radius:50%;margin:4px auto 0;background:
    radial-gradient(circle at 50% 50%,var(--bg) 0 9%,transparent 10%),
    repeating-radial-gradient(circle,#2a231e 0 3px,#1a1512 3px 6px);border:2px solid #3a322c}
  .disc.spin{animation:spin 2.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.disc.spin{animation:none}}
  .hidden{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Blind Player</h1>

  <section class="card" id="setup">
    <label for="cid">Spotify Client-ID</label>
    <input id="cid" autocomplete="off" spellcheck="false" placeholder="aus dem Spotify Developer Dashboard">
    <p class="hint">Redirect-URI für das Dashboard (genau so eintragen):<br><b id="redir"></b></p>
    <button id="login">Mit Spotify verbinden</button>
  </section>

  <section id="player" class="hidden" style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <label for="device">Abspielgerät</label>
      <div class="row">
        <select id="device"></select>
        <button class="ghost" id="refresh" style="flex:0 0 auto;width:auto" aria-label="Geräte neu laden">↻</button>
      </div>
      <p class="hint" id="devhint"></p>
    </div>

    <div id="viewfinder"><video id="video" playsinline muted></video></div>

    <div class="card">
      <div class="disc" id="disc"></div>
      <p id="status" role="status">Bereit. Karte scannen.</p>
      <p class="hint" id="raw"></p>
    </div>

    <button id="scan">Karte scannen</button>
    <button class="ghost" id="photoBtn">Foto statt Live-Scan</button>
    <input type="file" id="photo" accept="image/*" capture="environment" class="hidden">
    <div class="row">
      <button class="ghost" id="toggle" disabled>Pause</button>
      <button class="ghost" id="replay" disabled>Von vorn</button>
    </div>
    <button class="ghost" id="logout">Abmelden</button>
  </section>
</main>

<canvas id="canvas" class="hidden"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
const $ = id => document.getElementById(id);
const REDIRECT = location.origin + location.pathname;
const SCOPES = "streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state";
const store = {
  get:k=>{try{return localStorage.getItem(k)}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},
  del:k=>{try{localStorage.removeItem(k)}catch{}}
};
$("redir").textContent = REDIRECT;
$("cid").value = store.get("cid") || "";

/* ---------- Auth (PKCE, kein Client-Secret nötig) ---------- */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function login(){
  const cid = $("cid").value.trim();
  if(!cid){ $("cid").focus(); return; }
  store.set("cid", cid);
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  store.set("verifier", verifier);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const p = new URLSearchParams({client_id:cid,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:challenge});
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function tokenRequest(params){
  const r = await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:store.get("cid"),...params})});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.error || "Login fehlgeschlagen");
  store.set("access", j.access_token);
  store.set("expires", String(Date.now() + j.expires_in*1000 - 60000));
  if(j.refresh_token) store.set("refresh", j.refresh_token);
}
async function getToken(){
  if(Date.now() > Number(store.get("expires")||0)){
    const rt = store.get("refresh");
    if(!rt) throw new Error("Nicht angemeldet");
    await tokenRequest({grant_type:"refresh_token",refresh_token:rt});
  }
  return store.get("access");
}
async function api(path, opts={}){
  const t = await getToken();
  return fetch("https://api.spotify.com/v1"+path,{...opts,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json",...(opts.headers||{})}});
}
async function handleCallback(){
  const q = new URLSearchParams(location.search);
  if(q.get("error")){ setStatus("Spotify: "+q.get("error"),"err"); history.replaceState({},"",REDIRECT); return; }
  const code = q.get("code");
  if(!code) return;
  history.replaceState({},"",REDIRECT);
  try{ await tokenRequest({grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:store.get("verifier")}); }
  catch(e){ alert(e.message); }
}

/* ---------- Web Playback SDK (nur Desktop-Browser) ---------- */
let sdkDeviceId = null, sdkPlayer = null;
window.onSpotifyWebPlaybackSDKReady = () => {
  if(!store.get("refresh")) return;
  sdkPlayer = new Spotify.Player({name:"Blind Player (Browser)", getOAuthToken:cb=>getToken().then(cb), volume:0.8});
  sdkPlayer.addListener("ready", ({device_id})=>{ sdkDeviceId = device_id; loadDevices(device_id); });
  sdkPlayer.addListener("player_state_changed", s=>{ if(s){ $("toggle").textContent = s.paused ? "Weiter" : "Pause"; $("disc").classList.toggle("spin", !s.paused);} });
  sdkPlayer.addListener("authentication_error", e=>setStatus(e.message,"err"));
  sdkPlayer.addListener("account_error", ()=>setStatus("Für den Browser-Player ist Spotify Premium nötig.","err"));
  sdkPlayer.connect();
};

/* ---------- Geräte ---------- */
async function loadDevices(prefer){
  const r = await api("/me/player/devices");
  if(!r.ok){ $("devhint").textContent = "Geräte konnten nicht geladen werden ("+r.status+")."; return; }
  const {devices} = await r.json();
  const sel = $("device"); const old = prefer || sel.value || store.get("device");
  sel.innerHTML = "";
  devices.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=d.name+" ("+d.type+")"; sel.appendChild(o); });
  if(old && devices.some(d=>d.id===old)) sel.value = old;
  $("devhint").textContent = devices.length
    ? "Tipp: Auf einem Lautsprecher oder dem Laptop abspielen, dann sieht niemand den Titel."
    : "Kein Gerät gefunden. Öffne die Spotify-App auf einem Gerät (Handy, Lautsprecher) und tippe auf ↻.";
}
$("device").onchange = e => store.set("device", e.target.value);
$("refresh").onclick = () => loadDevices();

/* ---------- QR-Inhalt → Track-URI ---------- */
function parseTrack(text){
  const t = text.trim();
  let m = t.match(/spotify:track:([A-Za-z0-9]{22})/);
  if(m) return "spotify:track:"+m[1];
  m = t.match(/open\.spotify\.com\/(?:[a-z-]+\/)?track\/([A-Za-z0-9]{22})/);
  if(m) return "spotify:track:"+m[1];
  m = t.match(/^[A-Za-z0-9]{22}$/);
  if(m) return "spotify:track:"+t;
  return null;
}

/* ---------- Abspielen ---------- */
let currentUri = null;
function setStatus(msg, cls=""){ const s=$("status"); s.textContent=msg; s.className=cls; }
async function play(uri){
  const dev = $("device").value || sdkDeviceId;
  if(!dev){ setStatus("Kein Abspielgerät gewählt.","err"); return; }
  if(sdkPlayer && dev===sdkDeviceId){ try{ await sdkPlayer.activateElement(); }catch{} }
  const r = await api("/me/player/play?device_id="+encodeURIComponent(dev),{method:"PUT",body:JSON.stringify({uris:[uri],position_ms:0})});
  if(r.status===204 || r.ok){
    currentUri = uri;
    setStatus("Song läuft. Viel Spaß beim Raten!","ok");
    $("disc").classList.add("spin");
    $("toggle").disabled = false; $("toggle").textContent = "Pause"; $("replay").disabled = false;
  }else if(r.status===404){
    setStatus("Gerät nicht aktiv. Öffne Spotify dort kurz und tippe auf ↻.","err");
  }else if(r.status===403){
    setStatus("Spotify Premium wird für die Wiedergabe benötigt.","err");
  }else{
    setStatus("Wiedergabe fehlgeschlagen ("+r.status+").","err");
  }
}
$("toggle").onclick = async () => {
  const pausing = $("toggle").textContent === "Pause";
  const dev = $("device").value;
  const r = await api((pausing?"/me/player/pause":"/me/player/play")+"?device_id="+encodeURIComponent(dev),{method:"PUT"});
  if(r.ok){ $("toggle").textContent = pausing?"Weiter":"Pause"; $("disc").classList.toggle("spin",!pausing); }
};
$("replay").onclick = () => currentUri && play(currentUri);

/* ---------- Scanner ---------- */
let stream = null, scanning = false;
async function startScan(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  }catch(e){
    setStatus("Kamera nicht verfügbar. Auf dem Handy braucht die Seite HTTPS, am Rechner reicht 127.0.0.1.","err");
    return;
  }
  const v = $("video"); v.srcObject = stream; await v.play();
  $("viewfinder").style.display = "block";
  $("scan").textContent = "Abbrechen";
  setStatus("Halte die Kamera auf den QR-Code."); $("raw").textContent = "";
  scanning = true; requestAnimationFrame(tick);
}
function stopScan(){
  scanning = false;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $("viewfinder").style.display = "none";
  $("scan").textContent = "Nächste Karte scannen";
}
const detector = ("BarcodeDetector" in window) ? new BarcodeDetector({formats:["qr_code"]}) : null;
async function decodeSource(src, w, h){
  if(detector){
    try{ const r = await detector.detect(src); if(r.length && r[0].rawValue) return r[0].rawValue; }catch{}
  }
  if(typeof jsQR === "undefined") throw new Error("jsQR");
  const c = $("canvas"), ctx = c.getContext("2d",{willReadFrequently:true});
  for(const maxW of [1000, 640, 400]){
    const s = Math.min(1, maxW / w);
    c.width = Math.round(w*s); c.height = Math.round(h*s);
    ctx.drawImage(src,0,0,c.width,c.height);
    const img = ctx.getImageData(0,0,c.width,c.height);
    const code = jsQR(img.data, img.width, img.height, {inversionAttempts:"attemptBoth"});
    if(code && code.data) return code.data;
  }
  return null;
}
function handleCode(text){
  const uri = parseTrack(text);
  if(uri){ $("raw").textContent = ""; play(uri); }
  else{ setStatus("QR-Code erkannt, aber kein Spotify-Song darin.","err"); $("raw").textContent = "Inhalt: "+text; }
}
let busy = false;
async function tick(){
  if(!scanning) return;
  const v = $("video");
  if(!busy && v.readyState === v.HAVE_ENOUGH_DATA && v.videoWidth){
    busy = true;
    try{
      const text = await decodeSource(v, v.videoWidth, v.videoHeight);
      if(text){ busy = false; stopScan(); handleCode(text); return; }
    }catch(e){
      busy = false; stopScan();
      setStatus("QR-Leser konnte nicht geladen werden (Netzwerk blockiert?). Nutze „Foto statt Live-Scan“.","err");
      return;
    }
    busy = false;
  }
  requestAnimationFrame(tick);
}
$("scan").onclick = () => scanning ? (stopScan(), setStatus("Bereit. Karte scannen.")) : startScan();

$("photoBtn").onclick = () => $("photo").click();
$("photo").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  setStatus("Foto wird gelesen …");
  try{
    const bmp = await createImageBitmap(f);
    const text = await decodeSource(bmp, bmp.width, bmp.height);
    if(text) handleCode(text);
    else setStatus("Kein QR-Code im Foto gefunden. Näher ran, scharf und gerade fotografieren.","err");
  }catch{
    setStatus("Foto konnte nicht gelesen werden.","err");
  }
};

/* ---------- Start ---------- */
$("login").onclick = login;
$("logout").onclick = () => { ["access","refresh","expires","verifier"].forEach(store.del); location.reload(); };
(async()=>{
  await handleCallback();
  if(store.get("refresh")){
    $("setup").classList.add("hidden");
    $("player").classList.remove("hidden");
    try{ await loadDevices(); }catch(e){ setStatus(e.message,"err"); }
  }
})();
</script>
</body>
</html>
